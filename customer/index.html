    .item {

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .controls input[type="number"] {
      width: 60px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .btn-small {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-small:hover {
      background: #d62828;
    }

    .option-select {

      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .view-pdf {
      text-decoration: none;
      background: #2a9d8f;
      color: #fff;
      padding: 8px 12px;

  </style>
</head>

    // ---------------------- RENDER ----------------------
    const root = document.getElementById('menu-root');

    function renderItem(item) {
      const div = document.createElement('div');
      div.className = 'item';

      const img = document.createElement('img');
      img.src = item.img || '../assets/images/noimg.jpg';
      img.alt = item.name;
      div.appendChild(img);

      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = `<div class="name">${item.name}</div>`;
      if (item.price) {
        info.innerHTML += `<div class="meta"><b>₹${item.price}</b></div>`;
      } else if (item.options) {
        const sel = document.createElement('select');
        sel.className = 'option-select';
        item.options.forEach(opt => {
          const o = document.createElement('option');
          o.value = opt.price;
          o.text = `${opt.label} - ₹${opt.price}`;
          sel.appendChild(o);
        });
        info.appendChild(sel);
      }
      div.appendChild(info);

      const controls = document.createElement('div');
      controls.className = 'controls';
      const qty = document.createElement('input');
      qty.type = 'number'; qty.min = 1; qty.value = 1;
      const btn = document.createElement('button');
      btn.className = 'btn-small';
      btn.textContent = 'Add';
      btn.onclick = () => {
        let price = item.price;
        if (item.options) {
          const sel = info.querySelector('select');
          price = parseFloat(sel.value);
        }
        for (let i = 0; i < qty.value; i++) {
          addToCart(item.id, item.name, price, item.img);
        }
        updateBadge();
      };
      controls.appendChild(qty);
      controls.appendChild(btn);
      div.appendChild(controls);
      return div;
    }

    menuData.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'category';
      const h = document.createElement('h2');
      h.textContent = cat.category;
      section.appendChild(h);
      cat.items.forEach(it => {
        section.appendChild(renderItem(it));
      });
      root.appendChild(section);
    });
    updateBadge();
