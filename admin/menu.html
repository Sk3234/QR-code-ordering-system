<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Menu | Hotel Management</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 0;
    }
    header {
      background: #e63946;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .menu-container {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th {
      background: #fcd5b5;
    }
  </style>
</head>
<body>
  <header><h2>📋 Hotel Menu</h2></header>

  <div class="menu-container">
    <table id="menuTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Item Name</th>
          <th>Description</th>
          <th>Price (₹)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // Load menu from API (optional)
    async function loadMenu() {
      const res = await fetch('../api/get_menu.php');
      const menu = await res.json();
      const tbody = document.querySelector('#menuTable tbody');
      tbody.innerHTML = '';

      if (!menu.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No menu data available</td></tr>';
        return;
      }

      menu.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.name}</td>
          <td>${item.desc || '-'}</td>
          <td>₹${item.price}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadMenu();
  </script>
</body>
</html>
